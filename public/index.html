<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foot.DZ 7BS</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#07111e;
color:#fff;
}
header{
height:70px;
background:#0b1828;
border-bottom:1px solid #203047;
display:flex;
align-items:center;
gap:15px;
padding:0 25px;
position:sticky;
top:0;
z-index:10;
}
.logo{
font-size:24px;
font-weight:bold;
white-space:nowrap;
}
.logo span{color:#21d38b}
.search{
background:#101f32;
border:1px solid #263950;
border-radius:14px;
padding:12px 18px;
color:#9baabd;
flex:1;
max-width:500px;
}
.icons{margin-right:auto;display:flex;gap:8px}
.icon{
background:#101f32;
border:1px solid #263950;
color:white;
border-radius:12px;
width:42px;
height:42px;
font-size:18px;
}
.layout{
display:grid;
grid-template-columns:230px 1fr;
min-height:calc(100vh - 70px);
}
aside{
background:#081421;
border-left:1px solid #203047;
padding:25px 15px;
}
.menu{
display:block;
padding:14px;
margin:5px 0;
border-radius:12px;
color:#aebbd0;
text-decoration:none;
font-size:15px;
}
.menu:hover,.menu.active{
background:#12253a;
color:#fff;
border-right:3px solid #21d38b;
}
main{
padding:25px;
max-width:1450px;
width:100%;
margin:auto;
}
.hero{
min-height:300px;
border-radius:25px;
padding:45px;
display:flex;
align-items:center;
border:1px solid #263950;
background:
radial-gradient(circle at 75% 40%,rgba(33,211,139,.20),transparent 28%),
linear-gradient(120deg,#0b1929,#10303c);
}
.hero small{
color:#f3c95c;
font-size:14px;
}
.hero h1{
font-size:48px;
margin:15px 0;
}
.hero h1 span{color:#21d38b}
.hero p{
color:#b9c6d7;
font-size:19px;
margin:8px 0;
}
.grid{
display:grid;
grid-template-columns:minmax(0,1fr) 320px;
gap:20px;
margin-top:20px;
}
.box{
background:#0d1929;
border:1px solid #203047;
border-radius:20px;
padding:20px;
margin-bottom:20px;
}
.title{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:16px;
}
.title h2{
font-size:20px;
margin:0;
}
.more{color:#21d38b;font-size:13px}
.matches{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}
.match{
background:#112137;
border:1px solid #233850;
border-radius:16px;
padding:18px;
}
.league{
color:#8fa0b5;
font-size:12px;
margin-bottom:15px;
}
.teams{
display:grid;
grid-template-columns:1fr 75px 1fr;
align-items:center;
text-align:center;
gap:8px;
}
.team{
font-weight:bold;
font-size:15px;
}
.ball{
font-size:30px;
display:block;
margin-bottom:5px;
}
.time{
font-size:20px;
font-weight:bold;
}
.today{
color:#ff4d5d;
font-size:11px;
margin-top:5px;
}
.leagues{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}
.league-card{
background:#102034;
border:1px solid #203047;
border-radius:16px;
padding:20px;
font-weight:bold;
}
.league-card small{
display:block;
color:#899bb0;
margin-top:7px;
font-weight:normal;
}
.news-item{
display:flex;
gap:12px;
background:#101f31;
border-radius:14px;
padding:12px;
margin-bottom:10px;
}
.news-img{
width:90px;
height:65px;
border-radius:10px;
background:#173344;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
}
.news-text b{
font-size:14px;
line-height:1.5;
}
.news-text small{
display:block;
color:#899bb0;
margin-top:6px;
}
.score{
font-size:30px;
font-weight:bold;
text-align:center;
padding:20px;
}
.live{
color:#ff4d5d;
}
table{
width:100%;
border-collapse:collapse;
font-size:13px;
}
td,th{
padding:12px 5px;
border-bottom:1px solid #203047;
text-align:center;
}
th{color:#899bb0}
.bottom{display:none}

/* الهاتف */
@media(max-width:850px){
header{
height:64px;
padding:0 10px;
gap:7px;
}
header>.logo{
font-size:19px;
}
.search{
font-size:12px;
padding:11px;
}
.icons .icon:first-child{
display:none;
}
.icon{
width:40px;
height:40px;
}
.layout{
display:block;
}
aside{
display:none;
}
main{
padding:10px 8px 85px;
}
.hero{
min-height:245px;
padding:25px 20px;
border-radius:20px;
}
.hero h1{
font-size:34px;
}
.hero p{
font-size:16px;
}
.grid{
display:block;
}
.box{
padding:15px;
border-radius:17px;
margin-bottom:14px;
}
.title h2{
